[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# BLOQUEO DE INDEXACION — FASE 1
#
# Mientras el dominio propio NO apunte aqui, el sitio se sirve en
# https://<algo>.netlify.app. Si Google lo descubre, indexa 491 paginas
# duplicadas y te hundes tu mismo el dominio bueno.
#
# Por eso todo el sitio va con noindex. Netlify no permite aplicar una
# cabecera solo a un dominio concreto, asi que se bloquea entero y se
# levanta a mano en el momento del cambio.
#
# >>> AL APUNTAR EL DOMINIO: borra este bloque [[headers]] entero,
#     descomenta la regla de _redirects (ver public/_redirects) y despliega.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
